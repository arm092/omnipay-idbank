name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        guzzle: ['^7.0', '^8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, mbstring
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --with "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: composer test
      - run: composer audit --no-interaction
